apiVersion: v1
kind: ConfigMap
metadata:
  name: heart-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  heart-dashboard.json: |
    {
      "title": "Heart Disease Classifier",
      "uid": "heart-mlops",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "15s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Prediction Rate (req/s)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [{
            "datasource": { "type": "prometheus" },
            "expr": "rate(heart_predictions_total[1m])",
            "legendFormat": "class={{prediction}}"
          }]
        },
        {
          "id": 2,
          "title": "Predictions by Class",
          "type": "piechart",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [{
            "datasource": { "type": "prometheus" },
            "expr": "heart_predictions_total",
            "legendFormat": "class={{prediction}}"
          }]
        },
        {
          "id": 3,
          "title": "API Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [{
            "datasource": { "type": "prometheus" },
            "expr": "rate(http_requests_total{job=~\".*heart.*\"}[1m])",
            "legendFormat": "{{method}} {{status}}"
          }]
        },
        {
          "id": 4,
          "title": "p95 API Latency (s)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [{
            "datasource": { "type": "prometheus" },
            "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job=~\".*heart.*\"}[5m]))",
            "legendFormat": "p95 latency"
          }]
        },
        {
          "id": 5,
          "title": "p95 Model Inference Latency (s)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 16, "w": 12, "h": 8 },
          "targets": [{
            "datasource": { "type": "prometheus" },
            "expr": "histogram_quantile(0.95, rate(heart_prediction_latency_seconds_bucket[5m]))",
            "legendFormat": "p95 inference"
          }]
        },
        {
          "id": 6,
          "title": "Prediction Errors (errors/s)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 16, "w": 12, "h": 8 },
          "targets": [{
            "datasource": { "type": "prometheus" },
            "expr": "rate(heart_prediction_errors_total[5m])",
            "legendFormat": "{{error_type}}"
          }]
        },
        {
          "id": 7,
          "title": "Pod CPU Usage",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 24, "w": 12, "h": 8 },
          "targets": [{
            "datasource": { "type": "prometheus" },
            "expr": "rate(container_cpu_usage_seconds_total{namespace=~\"nonprod|prod\", container=\"heart-api\"}[1m])",
            "legendFormat": "{{namespace}} {{pod}}"
          }]
        },
        {
          "id": 8,
          "title": "Pod Memory Usage (bytes)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 24, "w": 12, "h": 8 },
          "targets": [{
            "datasource": { "type": "prometheus" },
            "expr": "container_memory_working_set_bytes{namespace=~\"nonprod|prod\", container=\"heart-api\"}",
            "legendFormat": "{{namespace}} {{pod}}"
          }]
        }
      ]
    }
